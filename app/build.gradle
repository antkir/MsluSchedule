plugins {
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    def versionMajor = 1
    def versionMinor = 90
    def versionPatch = 0
    def versionBuild = 0

    namespace 'by.ntnk.msluschedule'

    compileSdk 34
    buildToolsVersion = "34.0.0"

    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        disable 'UseCompoundDrawables', 'CheckResult'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        debug.java.srcDirs += 'src/debug/kotlin'
        release.java.srcDirs += 'src/release/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/CHANGES', 'META-INF/README.md', 'org/apache/**']
        }
    }
    defaultConfig {
        applicationId "by.ntnk.msluschedule"
        minSdk 21
        targetSdk 34
        versionCode versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation":"$projectDir/schemas".toString(),
                        "room.incremental":"true"
                ]
            }
        }
        resourceConfigurations += ["en", "be", "ru"]
    }
    buildTypes {
        debug {
            multiDexEnabled true
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
        release {
            multiDexEnabled false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

ext {
    appcompatVersion = '1.6.1'
    constraintlayoutVersion = '2.1.4'
    coreVersion = '1.12.0'
    daggerVersion = '2.48.1'
    firebasebomVersion = '32.5.0'
    fragmentVersion = '1.6.2'
    jsoupVersion = '1.16.2'
    junitVersion = '4.13.2'
    leakcanaryVersion = '2.12'
    materialVersion = '1.10.0'
    mockitoVersion = '5.7.0'
    multidexVersion = '2.0.1'
    okhttpVersion = '4.12.0'
    // POI 4.1.0 release bumps minimum requirements to Android O+ (minSdk 26).
    poiVersion = '4.0.1'
    preferenceVersion = '1.2.1'
    recyclerviewVersion = '1.3.2'
    retrofitVersion = '2.9.0'
    roomVersion = '2.6.0'
    rxandroidVersion = '3.0.2'
    rxjavaVersion = '3.1.8'
    rxkotlinVersion = '3.0.1'
    spotlightVersion = '2.0.5'
    swiperefreshlayoutVersion = '1.1.0'
    testextjunitVersion = '1.1.5'
    testrunnerVersion = '1.5.2'
    threetenbpVersion = '1.6.8'
    timberVersion = '5.0.1'
    windowVersion = '1.2.0'
}

dependencies {
    // AndroidX libraries
    implementation "androidx.appcompat:appcompat:$appcompatVersion"
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayoutVersion"
    implementation "androidx.core:core-ktx:$coreVersion"
    implementation "androidx.fragment:fragment-ktx:$fragmentVersion"
    implementation "androidx.multidex:multidex:$multidexVersion"
    implementation "androidx.preference:preference-ktx:$preferenceVersion"
    implementation "androidx.recyclerview:recyclerview:$recyclerviewVersion"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-rxjava3:$roomVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$swiperefreshlayoutVersion"
    implementation "androidx.window:window:$windowVersion"
    kapt "androidx.room:room-compiler:$roomVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation "androidx.test.ext:junit-ktx:$testextjunitVersion"
    androidTestImplementation "androidx.test:runner:$testrunnerVersion"
    // Dagger
    implementation "com.google.dagger:hilt-android:$daggerVersion"
    kapt "com.google.dagger:hilt-compiler:$daggerVersion"
    // Jsoup
    implementation "org.jsoup:jsoup:$jsoupVersion"
    // Material Components
    implementation "com.google.android.material:material:$materialVersion"
    // Okhttp
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttpVersion"
    // Poi
    implementation "org.apache.poi:poi:$poiVersion"
    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.retrofit2:adapter-rxjava3:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-moshi:$retrofitVersion"
    // RxAndroid
    implementation "io.reactivex.rxjava3:rxandroid:$rxandroidVersion"
    // RxJava
    implementation "io.reactivex.rxjava3:rxjava:$rxjavaVersion"
    // RxKotlin
    implementation "io.reactivex.rxjava3:rxkotlin:$rxkotlinVersion"
    // Spotlight
    implementation "com.github.takusemba:spotlight:$spotlightVersion"
    // Timber
    implementation "com.jakewharton.timber:timber:$timberVersion"
    // Time
    implementation "org.threeten:threetenbp:$threetenbpVersion:no-tzdb"
    // LeakCanary
    debugImplementation "com.squareup.leakcanary:leakcanary-android:$leakcanaryVersion"
    // Testing
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "junit:junit:$junitVersion"
    // Firebase
    implementation platform("com.google.firebase:firebase-bom:$firebasebomVersion")
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
}
